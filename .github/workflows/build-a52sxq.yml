# a52sxq (Samsung Galaxy A52s 5G, SM-A528B, SM7325) port checks.
#
# Everything heavy runs here, on GitHub's runners, so a low-end local host only
# runs the light commands. No job talks to a phone and no job contains a device
# command: the only device operation this project permits is a person running
# `fastboot boot <image>` at the phone, and there is no such step here.
#
#   checks  the porting tool's tests, the device package structure, the package audit
#   loader  a real UEFI loader build with RAM-only logging, then the loader check
#   kernel  the XNU kernel and the loader on a macOS runner (on by default; set the
#           repository variable HAKIOS_BUILD_KERNEL=false to skip it). No image:
#           an image needs the phone's own `loader { }` values, which are not read
#           yet, and tools/image.py refuses to guess them.
name: a52sxq

on:
  workflow_dispatch:
  push:
    branches: [a52sxq-port]
    paths:
      - "porting/**"
      - ".github/workflows/build-a52sxq.yml"
  pull_request:
    paths:
      - "porting/**"
      - ".github/workflows/build-a52sxq.yml"

permissions:
  contents: read

concurrency:
  group: a52sxq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: package and tool checks (no phone)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The porting tool's tests
        run: python3 porting/tests/run_tests.py
      - name: Import the device package into the checkout (host-side only)
        run: python3 tools/device.py add a52sxq --from porting/devices/a52sxq
      - name: The device package is structurally valid
        run: |
          python3 tools/boards.py check
          python3 tools/boards.py status a52sxq
      - name: Package scoped storage audit
        run: python3 porting/hakios_port.py --codename a52sxq verify-safety
      - name: The audit must pass
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          report = json.loads(pathlib.Path("porting/reports/storage-audit.json").read_text())
          problems = []
          if report.get("ok") is not True:
              problems.append("audit did not pass")
          if report.get("summary", {}).get("unmitigated_persistent") != 0:
              problems.append("an unmitigated persistent write is present")
          if report.get("command_log_check", {}).get("ok") is not True:
              problems.append("the command log check did not pass")
          print("\n".join(problems) if problems else "package audit: PASS")
          sys.exit(1 if problems else 0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a52sxq-audit
          path: porting/reports/
          retention-days: 14

  loader:
    name: loader build and RAM-only log check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld
      - name: Import the device package into the checkout (host-side only)
        run: python3 tools/device.py add a52sxq --from porting/devices/a52sxq
      - name: Build the loader with the no-persistent-log guard
        env:
          LOADER_CFLAGS: -DHAKIOS_NO_PERSISTENT_LOG=1
        run: arch/arm64/boot/build.sh
      - name: The built loader keeps its log in RAM only
        run: python3 porting/tools/check_built_loader.py --kernel-src .
      - uses: actions/upload-artifact@v4
        with:
          name: a52sxq-loader
          path: arch/arm64/boot/loader.efi
          if-no-files-found: error
          retention-days: 14

  kernel:
    name: kernel and loader
    # On by default: the heavy build belongs on GitHub's runner, not a low-end
    # local host. Set the repository variable HAKIOS_BUILD_KERNEL=false to skip it.
    if: vars.HAKIOS_BUILD_KERNEL != 'false'
    # The macOS arm64 pool has been at capacity for this repository ("job was not
    # acquired by Runner of type hosted"), so the job runs on the Intel macOS
    # runner, whose pool is separate. Apple's build system cross-compiles the
    # arm64 kernel from either host, and nothing here depends on the host's ISA.
    runs-on: macos-15-intel
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import the device package into the checkout (host-side only)
        run: python3 tools/device.py add a52sxq --from porting/devices/a52sxq
      - name: Toolchain
        run: |
          uname -a
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          make --version | head -1
      - name: Kernel build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install automake autoconf libtool gawk lld
      - name: Put LLVM's linker on PATH
        run: echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - name: Build the kernel for a52sxq
        run: make kernel
      - name: Build the loader with the no-persistent-log guard
        env:
          LOADER_CFLAGS: -DHAKIOS_NO_PERSISTENT_LOG=1
        run: make loader
      - name: The built loader keeps its log in RAM only
        run: python3 porting/tools/check_built_loader.py --kernel-src .
      # `make image` is deliberately not run: an image needs a `loader { }`
      # section in arch/arm64/boot/dts/a52sxq/board.dts (the framebuffer base and
      # the rest of the phone's loader platform description), and that data has
      # not been read from this phone. tools/image.py refuses a loader that does
      # not name the board, which is the right answer until those values are real.
      - name: Collect the built kernel and loader
        run: |
          mkdir -p build/kernel
          cp ../xnu-12377-hakios/BUILD/obj/mach.development.bcm2837 build/kernel/
          cp arch/arm64/boot/loader.efi build/kernel/
          ls -l build/kernel
      - uses: actions/upload-artifact@v4
        with:
          name: a52sxq-kernel
          path: build/kernel/
          if-no-files-found: error
          retention-days: 14
